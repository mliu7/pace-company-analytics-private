name: Shared application checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PCA_TEST_ADMIN: postgres
      PCA_TEST_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - run: pip install -r requirements.txt
      - run: python scripts/check_repository_privacy.py --tree HEAD
      - run: python manage.py test tests --settings=config.test_shared --noinput
